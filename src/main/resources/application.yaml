spring:
  application:
    name: dolcelou
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dbdolcelou}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    show-sql: false

server:
  port: ${PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health
